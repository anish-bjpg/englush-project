// ─── FIREBASE HELPERS ─────────────────────────────────────────────────────────
function roomRef(path) {
  return ref(database, path ? 'rooms/'+myRoom+'/'+path : 'rooms/'+myRoom);
}

function listenToRoom(code) {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  const r = ref(database, 'rooms/' + code);
  unsubscribe = onValue(r, snap => {
    const data = snap.val();
    if (!data) { view = 'home'; gameState = null; render(); return; }
    gameState = data;
    const phaseMap = {lobby:'lobby',word:'word',discuss:'discuss',vote:'vote',results_round:'results',guess:'guess',final:'final'};
    const newView = phaseMap[data.phase] || data.phase;
    if (newView !== view) { view = newView; }
    render();
  });
}

function stopListening() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  gameState = null;
}

async function updateGame(updates) {
  await update(ref(database,'rooms/'+myRoom), updates);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function shuffleArr(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// Seeded shuffle so all clients get same order from same seed
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickWord(level){const pool=level==='sophomore'?SOPHOMORE:level==='both'?[...FRESHMAN,...SOPHOMORE]:FRESHMAN;return pool[Math.floor(Math.random()*pool.length)];}
function genCode(){let c='';while(c.length<5){c+=Math.random().toString(36).toUpperCase().replace(/[^A-Z]/g,'');}return c.slice(0,5);}
function levelLabel(l){return l==='sophomore'?'Sophomore':l==='both'?'Both Lists':'Freshman';}

}

async function revealVote(){
  const game=gameState;if(!game)return;
  const players=Object.values(game.players||{});
  let tallies={};
  players.filter(p=>p.alive).forEach(p=>{tallies[p.id]=0;});
  Object.values(game.votes||{}).forEach(v=>{if(tallies[v]!==undefined)tallies[v]++;});
  let maxV=0;
  Object.values(tallies).forEach(c=>{if(c>maxV)maxV=c;});
  const tied=Object.entries(tallies).filter(([,c])=>c===maxV).map(([id])=>id);
  const eliminated=tied[Math.floor(Math.random()*tied.length)];
  const wasTied=tied.length>1;
  const newEliminated=[...(game.eliminated||[]),eliminated];
  const playerUpdates={};
  players.forEach(p=>{playerUpdates[p.id]={...p,alive:p.id!==eliminated};});
  const nextPhase=eliminated===game.imposter?'guess':'results_round';
  await updateGame({eliminated:newEliminated,lastEliminated:eliminated,wasTied,phase:nextPhase,votes:{},players:playerUpdates});
}

  <p class="subtitle" style="margin-bottom:14px">"The imposter is unmasked — but can they guess the word?"</p>
  <div class="discuss-box">
    <p class="discuss-q">"${imposterPlayer?imposterPlayer.name:'The imposter'} hath been voted out! If they can name the secret root or affix, glory shall be theirs!"</p>
  </div>
  ${!isImposter&&wo.type?`<div style="margin:10px 0;padding:10px 14px;background:var(--parchment2);border:1px solid var(--border);border-radius:3px;font-size:13px;color:var(--muted);font-style:italic">
    The word was: <strong style="font-family:'Cinzel',serif;color:var(--red)">${wo.word}</strong> — meaning "${wo.meaning}"
  </div>`:''}
  <div class="divider"></div>
  ${isImposter?`<p style="font-size:13px;color:var(--muted);font-style:italic;margin-bottom:4px">Clue — the word is a <strong style="color:var(--ink)">${wo.type||'root/prefix/suffix'}</strong>.</p>
    <label style="font-size:13px;color:var(--muted);font-style:italic;display:block;margin-bottom:6px;margin-top:8px">Thy guess:</label>
    <input type="text" id="guessInput" placeholder="Name the root, prefix, or suffix..." maxlength="40" style="margin-bottom:10px">
    <button class="btn btn-primary btn-full" onclick="submitGuess()">⚔ Submit My Guess</button>`
  :`<p class="info">${imposterPlayer?imposterPlayer.name:'The imposter'} is making their guess...</p>`}`;}

function normalizeWord(s){
  return s.toLowerCase().replace(/[-\/\s]/g,'');
}
async function submitGuess(){
  const game=gameState;if(!game)return;
  const guess=document.getElementById('guessInput').value.trim();
  if(!guess)return;
  const wo=game.wordObj||{};
  const variants=(wo.word||'').split('/').map(normalizeWord);
  const got=variants.includes(normalizeWord(guess));
  await updateGame({imposterGuess:guess,imposterGotIt:got,imposterWon:false,phase:'final'});
}

function finalView(){
  const game=gameState;if(!game)return'';
  const players=Object.values(game.players||{});
  const imposterPlayer=players.find(p=>p.id===game.imposter);
  const wo=game.wordObj||{word:'???',type:'root',meaning:'',examples:''};
  let titleText,subText,emoji;
  if(game.imposterWon){emoji='🎭';titleText='The Imposter Hath Won!';subText=`${imposterPlayer?imposterPlayer.name:'The imposter'} survived to the end, never unmasked!`;}
  else if(game.imposterGotIt){emoji='🎉';titleText='A Bittersweet Victory!';subText=`The imposter ${imposterPlayer?imposterPlayer.name:''} was unmasked, yet guessed the word correctly! Honours are shared!`;}
  else{emoji='⚔';titleText='The Townsfolk Triumph!';subText=`The imposter guessed "${game.imposterGuess||'nothing'}" — wrong! Justice prevails!`;}
  return`<h1>The Final Curtain</h1>
  <p class="subtitle" style="margin-bottom:12px">"The play is done — what fate hath been wrought?"</p>
  <div class="result-box">
    <div class="result-emoji">${emoji}</div>
    <p class="result-title">${titleText}</p>
    <p class="result-sub">${subText}</p>
  </div>
  <div class="word-reveal" style="margin:0 0 12px">
    <p class="word-label">The secret word was...</p>
    <div class="word-big">${wo.word}</div>
    <div class="word-type">${wo.type}</div>
    <div class="word-meaning">"${wo.meaning}"</div>
    <div class="word-examples">e.g. ${wo.examples}</div>
  </div>
  <h2>The Players</h2>
  <ul class="player-list" style="margin-bottom:14px">
    ${players.map(p=>`<li>
      <span style="font-size:15px">${p.id===game.imposter?'🎭':'👑'}</span>
      <span style="flex:1">${p.name}</span>
      <span style="font-size:12px;color:var(--muted);font-style:italic">${p.id===game.imposter?'The Imposter':'Townsfolk'}</span>
    </li>`).join('')}
  </ul>
  ${game.hostId===myId?`<button class="btn btn-primary btn-full" onclick="playAgain()" style="margin-bottom:8px">⚔ Play Again</button>`:''}
  <button class="btn btn-secondary btn-full" onclick="leaveGame()">Leave Stage</button>`;}

async function playAgain(){
  const game=gameState;if(!game)return;
  const players={};
  Object.values(game.players||{}).forEach(p=>{players[p.id]={...p,ready:false,alive:true};});
  await updateGame({phase:'lobby',players,wordObj:null,imposter:'',votes:null,eliminated:null,imposterGuess:'',imposterGotIt:false,imposterWon:false,voteRequests:null,speakSeed:0,wasTied:false});
}

async function leaveGame(){
  if(myRoom){
    const snap=await get(ref(database,'rooms/'+myRoom+'/players'));
    const players=snap.val()||{};
    delete players[myId];
    if(Object.keys(players).length===0){
      await remove(ref(database,'rooms/'+myRoom));
    } else {
      if(gameState&&gameState.hostId===myId){
        const first=Object.values(players).sort((a,b)=>a.order-b.order)[0];
        if(first){players[first.id].host=true;await update(ref(database,'rooms/'+myRoom),{players,hostId:first.id});}
      } else {
        await remove(ref(database,'rooms/'+myRoom+'/players/'+myId));
      }
    }
  }
  stopListening();myRoom='';view='home';gameState=null;render();
}

// Expose all functions to window so onclick handlers work inside type="module"
Object.assign(window, {
  switchTab, setLevel, createRoom, joinRoom, setReady, startGame,
  goDiscuss, prevQ, nextQ, goVote, forceVote, castVote, revealVote,
  continueAfterElim, submitGuess, playAgain, leaveGame
});

// ─── BOOT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
